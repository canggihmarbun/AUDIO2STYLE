    <script>
      // Compatibility patch for browser extensions that overwrite window.fetch
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(fn) {
              _origFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore
        }

        // Safeguard against third-party extension uncaught exceptions
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
